name: Release

# Cut a release by pushing a version tag (e.g. v1.0.1). This builds the Windows
# NSIS installer and publishes it — together with latest.yml + blockmap — to the
# PUBLIC releases repo (code-deck-releases), which is the app's update feed.
#
# Auth: publishing to a DIFFERENT repo than this one requires a token with
# contents:write on code-deck-releases, stored as the repo secret
# GH_RELEASES_TOKEN. The built-in GITHUB_TOKEN only covers THIS repo, so it can't
# be used for the cross-repo publish. No token is ever shipped in the app.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # allow manual runs (e.g. to re-publish the current version)

permissions:
  contents: read # least privilege: we publish elsewhere via GH_RELEASES_TOKEN

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $TAG does not match package.json version $VER. Use 'npm run release' to keep them in sync."
            exit 1
          fi

      - name: Build & publish NSIS installer to code-deck-releases
        run: npm run publish
        env:
          # PAT (or fine-grained token) with contents:write on code-deck-releases.
          GH_TOKEN: ${{ secrets.GH_RELEASES_TOKEN }}
